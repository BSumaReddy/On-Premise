name: Semgrep Scan Pipeline

on:
  push:
    branches: ["main","test"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Scan
        run: semgrep scan --config auto --json -o report.json || true

      - name: Show Report
        run: cat report.json

      - name: Send Report to Backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          curl -X POST "${BACKEND_URL}/api/scan/upload" \
            -H "Content-Type: application/json" \
            -d @report.json || true
